<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA Alma-Ata</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f7f7f7; }
        .bg-mega-red { background-color: #e50914; }
        .text-mega-red { color: #e50914; }
        .border-mega-red { border-color: #e50914; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <!-- Mobile Wrapper Container -->
    <div id="main-wrapper" class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative overflow-hidden pb-20">

        <!-- Top Header -->
        <header class="bg-mega-red text-white p-4 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="bg-white text-mega-red font-black px-2 py-1 rounded text-lg">20</div>
                <span class="font-bold text-xl tracking-wide">MEGA Alma-Ata</span>
            </div>
            <div class="flex items-center space-x-2 space-x-reverse bg-red-700 px-3 py-1 rounded-full text-sm">
                <i class="fa-solid fa-globe"></i>
                <span>عربي</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="app-content" class="flex-1 overflow-y-auto">
            <!-- Dynamic Pages -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center py-2 z-50 shadow-lg">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-mega-red">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-xs mt-1">بيت</span>
            </button>
            <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center text-gray-500">
                <i class="fa-solid fa-file-lines text-lg"></i>
                <span class="text-xs mt-1">المهام</span>
            </button>
            <button onclick="switchTab('team')" id="nav-team" class="flex flex-col items-center text-gray-500">
                <i class="fa-solid fa-users text-lg"></i>
                <span class="text-xs mt-1">فريق</span>
            </button>
            <button onclick="switchTab('vip')" id="nav-vip" class="flex flex-col items-center text-gray-500">
                <i class="fa-solid fa-crown text-lg"></i>
                <span class="text-xs mt-1">كبار الشخصيات</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-500">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-xs mt-1">أنا</span>
            </button>
        </nav>

        <!-- Modals Container -->
        <div id="modal-container"></div>
    </div>

    <script>
        // App State
        let currentTab = 'home';
        let userBalance = parseFloat(localStorage.getItem('mega_balance') || '0');
        let totalDeposit = parseFloat(localStorage.getItem('mega_deposit') || '0');
        let userPhone = localStorage.getItem('mega_phone') || '+10934126080';
        let userVip = localStorage.getItem('mega_vip') || 'VIP0';
        const depositAddress = '0xb6c5fea9da57c4e234ce95a9b56261e3da14acf5';
        const inviteCode = '154974';
        const inviteLink = 'https://mega-alma.vip/ref?id=154974';

        let depositsList = JSON.parse(localStorage.getItem('mega_admin_deposits') || JSON.stringify([]));

        function saveData() {
            localStorage.setItem('mega_balance', userBalance);
            localStorage.setItem('mega_deposit', totalDeposit);
            localStorage.setItem('mega_vip', userVip);
            localStorage.setItem('mega_phone', userPhone);
            localStorage.setItem('mega_admin_deposits', JSON.stringify(depositsList));
        }

        const vipLevels = [
            { id: 1, name: 'VIP1', price: 3.00, dailyTasks: 1, taskReward: 1.00, dailyProfit: 1.00, totalProfit: 365.00 },
            { id: 2, name: 'VIP2', price: 18.00, dailyTasks: 1, taskReward: 6.00, dailyProfit: 6.00, totalProfit: 2190.00 },
            { id: 3, name: 'VIP3', price: 96.00, dailyTasks: 1, taskReward: 32.00, dailyProfit: 32.00, totalProfit: 11680.00 },
            { id: 4, name: 'VIP4', price: 280.00, dailyTasks: 1, taskReward: 95.00, dailyProfit: 95.00, totalProfit: 34675.00 },
            { id: 5, name: 'VIP5', price: 600.00, dailyTasks: 1, taskReward: 214.00, dailyProfit: 214.00, totalProfit: 78110.00 },
            { id: 6, name: 'VIP6', price: 1500.00, dailyTasks: 1, taskReward: 576.00, dailyProfit: 576.00, totalProfit: 210240.00 },
            { id: 7, name: 'VIP7', price: 3500.00, dailyTasks: 1, taskReward: 1400.00, dailyProfit: 1400.00, totalProfit: 511000.00 },
            { id: 8, name: 'VIP8', price: 8800.00, dailyTasks: 1, taskReward: 3800.00, dailyProfit: 3800.00, totalProfit: 1387000.00 },
            { id: 9, name: 'VIP9', price: 28000.00, dailyTasks: 1, taskReward: 13830.00, dailyProfit: 13830.00, totalProfit: 5047950.00 },
            { id: 10, name: 'VIP10', price: 48000.00, dailyTasks: 1, taskReward: 26000.00, dailyProfit: 26000.00, totalProfit: 9490000.00 }
        ];

        function copyText(text, msg) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => alert(msg)).catch(() => fallbackCopy(text, msg));
            } else {
                fallbackCopy(text, msg);
            }
        }

        function fallbackCopy(text, msg) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); alert(msg); } catch (err) { alert('فشل النسخ'); }
            document.body.removeChild(textArea);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-mega-red');
                btn.classList.add('text-gray-500');
            });
            const activeBtn = document.getElementById(`nav-${tab}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-gray-500');
                activeBtn.classList.add('text-mega-red');
            }
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('app-content');
            if (currentTab === 'home') {
                container.innerHTML = `
                    <div class="p-4 space-y-4">
                        <div class="bg-gradient-to-r from-red-600 to-red-800 text-white p-4 rounded-xl shadow">
                            <h2 class="text-xl font-bold">مرحباً بك في MEGA Alma-Ata</h2>
                            <p class="text-sm mt-1 opacity-90">منصة الاستثمار والمهام الموثوقة في آسيا الوسطى</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="openDeposit()" class="bg-blue-50 text-blue-600 p-4 rounded-xl font-bold flex flex-col items-center shadow border border-blue-100">
                                <i class="fa-solid fa-wallet text-2xl mb-2"></i> إيداع
                            </button>
                            <button onclick="openWithdraw()" class="bg-orange-50 text-orange-600 p-4 rounded-xl font-bold flex flex-col items-center shadow border border-orange-100">
                                <i class="fa-solid fa-money-bill-transfer text-2xl mb-2"></i> سحب
                            </button>
                        </div>
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-2">
                            <h3 class="font-bold text-gray-700"><i class="fa-solid fa-circle-info text-mega-red ml-1"></i> معلومات عنا</h3>
                            <p class="text-xs text-gray-600 leading-relaxed">أحد مراكز التسوق الأكثر شهرة MEGA Alma-Ata يقع في كازاخستان، ألماتي...</p>
                            <button onclick="switchTab('vip')" class="text-xs text-mega-red font-bold underline">عرض خطط كبار الشخصيات &larr;</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'tasks') {
                container.innerHTML = `
                    <div class="p-4 space-y-4">
                        <h2 class="font-bold text-lg text-gray-800">المهام اليومية</h2>
                        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm">مهمة الاستثمار النشطة (${userVip})</p>
                                <p class="text-xs text-gray-500 mt-1">قم بإتمام المهمة للحصول على الأرباح اليومية</p>
                            </div>
                            <button onclick="completeTask()" class="bg-mega-red text-white px-4 py-2 rounded-lg text-sm font-bold shadow">إتمام المهمة</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'team') {
                container.innerHTML = `
                    <div class="p-4 space-y-4">
                        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3">
                            <p class="text-xs text-gray-500">رمز الدعوة:</p>
                            <div class="flex justify-between items-center bg-gray-50 p-2 rounded border">
                                <span class="font-bold text-mega-red">${inviteCode}</span>
                                <button onclick="copyText('${inviteCode}', 'تم نسخ رمز الدعوة!')" class="bg-mega-red text-white text-xs px-3 py-1 rounded">نسخ الرمز</button>
                            </div>
                            <p class="text-xs text-gray-500">رابط الإحالة:</p>
                            <div class="flex justify-between items-center bg-gray-50 p-2 rounded border">
                                <span class="text-xs text-gray-600 truncate max-w-[200px]">${inviteLink}</span>
                                <button onclick="copyText('${inviteLink}', 'تم نسخ رابط الإحالة!')" class="bg-mega-red text-white text-xs px-3 py-1 rounded">نسخ الرابط</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-center">
                            <div class="bg-blue-900 text-white p-3 rounded-xl"><p class="text-xs">المستوى 1</p><p class="font-bold text-sm mt-1">13%</p></div>
                            <div class="bg-blue-800 text-white p-3 rounded-xl"><p class="text-xs">المستوى 2</p><p class="font-bold text-sm mt-1">2%</p></div>
                            <div class="bg-blue-700 text-white p-3 rounded-xl"><p class="text-xs">المستوى 3</p><p class="font-bold text-sm mt-1">1%</p></div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'vip') {
                container.innerHTML = `
                    <div class="p-4 space-y-4">
                        <h2 class="font-bold text-lg text-gray-800">مستويات كبار الشخصيات (VIP)</h2>
                        ${vipLevels.map(v => `
                            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-mega-red text-lg">${v.name}</span>
                                    <span class="text-xs bg-gray-100 px-2 py-1 rounded">المهام: ${v.dailyTasks}</span>
                                </div>
                                <div class="text-xs text-gray-600 space-y-1">
                                    <p>الربح لكل مهمة: <span class="text-green-600 font-bold">${v.taskReward.toFixed(2)} USDT</span></p>
                                    <p>الربح اليومي: <span class="font-bold">${v.dailyProfit.toFixed(2)} USDT</span></p>
                                </div>
                                <button onclick="upgradeVip(${v.price}, '${v.name}')" class="w-full bg-black text-white py-2 rounded-lg text-sm font-bold">افتح الآن ${v.price.toFixed(2)} USDT</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTab === 'profile') {
                container.innerHTML = `
                    <div class="p-4 space-y-4">
                        <div class="bg-gray-900 text-white p-4 rounded-xl flex items-center justify-between">
                            <div>
                                <p class="text-xs text-gray-400">مرحباً،</p>
                                <p class="font-bold text-lg">${userPhone}</p>
                            </div>
                            <span class="bg-amber-500 text-black text-xs font-bold px-2 py-1 rounded">${userVip}</span>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm grid grid-cols-2 gap-4 text-center">
                            <div><p class="text-xs text-gray-500">الرصيد الإجمالي (USDT)</p><p class="font-bold text-lg text-mega-red">${userBalance.toFixed(2)}</p></div>
                            <div><p class="text-xs text-gray-500">مبلغ الإيداع (USDT)</p><p class="font-bold text-lg">${totalDeposit.toFixed(2)}</p></div>
                        </div>
                        <button onclick="switchTab('records')" class="w-full bg-white border p-3 rounded-xl flex justify-between items-center text-sm font-bold shadow-sm">
                            <span><i class="fa-solid fa-clock-rotate-left text-mega-red ml-2"></i> سجلات الإيداع والسحب</span>
                            <i class="fa-solid fa-chevron-left text-gray-400"></i>
                        </button>
                    </div>
                `;
            } else if (currentTab === 'records') {
                container.innerHTML = `
                    <div class="p-4 space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-lg text-gray-800">السجلات</h2>
                            <button onclick="switchTab('profile')" class="text-xs bg-gray-200 px-3 py-1 rounded">عودة</button>
                        </div>
                        <div class="bg-white p-6 rounded-xl border space-y-2">
                            ${depositsList.length === 0 ? '<p class="text-center text-gray-400 text-sm">لا توجد سجلات إيداع سابقة</p>' : depositsList.map(d => `
                                <div class="flex justify-between items-center border-b pb-2 text-xs">
                                    <div><span class="font-bold text-green-600">+${d.amount} USDT</span><p class="text-gray-400">${d.date}</p></div>
                                    <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded">${d.status}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        function openDeposit() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/60 flex justify-center items-center z-50 p-4">
                    <div class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-xl">
                        <div class="flex justify-between items-center border-b pb-2">
                            <h3 class="font-bold text-gray-800">إيداع USDT (BEP20)</h3>
                            <button onclick="closeModal()" class="text-gray-500 font-bold">&times;</button>
                        </div>
                        <div class="text-center space-y-2">
                            <div class="bg-gray-100 p-2 rounded inline-block text-xs font-mono break-all">${depositAddress}</div>
                            <button onclick="copyText('${depositAddress}', 'تم نسخ عنوان الإيداع!')" class="bg-mega-red text-white w-full py-2 rounded-lg text-sm font-bold">نسخ عنوان الإيداع</button>
                        </div>
                        <button onclick="confirmDeposit(10)" class="w-full bg-green-600 text-white py-2 rounded-lg text-sm font-bold">تأكيد إيداع تجريبي (+10 USDT)</button>
                    </div>
                </div>
            `;
        }

        function openWithdraw() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/60 flex justify-center items-center z-50 p-4">
                    <div class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-xl">
                        <div class="flex justify-between items-center border-b pb-2">
                            <h3 class="font-bold text-gray-800">سحب الأموال</h3>
                            <button onclick="closeModal()" class="text-gray-500 font-bold">&times;</button>
                        </div>
                        <div class="space-y-3">
                            <input type="number" id="withdraw-amount" placeholder="الكمية (USDT)" class="w-full border p-2 rounded text-sm">
                            <input type="text" placeholder="عنوان السحب (BEP20)" class="w-full border p-2 rounded text-sm">
                            <input type="password" placeholder="كلمة المرور" class="w-full border p-2 rounded text-sm">
                            <button onclick="processWithdraw()" class="w-full bg-mega-red text-white py-2 rounded-lg text-sm font-bold">تأكيد السحب</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function confirmDeposit(amount) {
            userBalance += amount;
            totalDeposit += amount;
            depositsList.push({ amount: amount, date: new Date().toLocaleDateString(), status: 'مكتمل' });
            
            saveData();
            closeModal();
            alert('تمت إضافة الإيداع بنجاح!');
            renderContent();
        }

        function processWithdraw() {
            const amt = parseFloat(document.getElementById('withdraw-amount').value);
            if(isNaN(amt) || amt <= 0) { alert('أدخل كمية صحيحة'); return; }
            if(amt > userBalance) { alert('رصيدك غير كافٍ'); return; }
            userBalance -= amt;
            saveData();
            closeModal();
            alert('تم تقديم طلب السحب بنجاح!');
            renderContent();
        }

        function upgradeVip(price, vipName) {
            if(userBalance < price) {
                alert('رصيدك غير كافٍ، يرجى الإيداع أولاً.');
                openDeposit();
                return;
            }
            userBalance -= price;
            userVip = vipName;
            saveData();
            alert(`تم ترقية حسابك إلى ${vipName} بنجاح!`);
            renderContent();
        }

        function completeTask() {
            if(userVip === 'VIP0') {
                alert('يرجى ترقية حسابك أولاً لتنفيذ المهام.');
                switchTab('vip');

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virelo Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0d1322; color: #ffffff; padding-bottom: 70px; }

        /* Navbar Bottom */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #ffffff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e2e8f0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; text-decoration: none; font-size: 11px; cursor: pointer; }
        .nav-item.active { color: #3b82f6; }
        .nav-item i { font-size: 18px; margin-bottom: 3px; }

        /* Header Cards */
        .app-header { background: #1a233d; padding: 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; text-align: right; position: relative; }
        .balance-title { font-size: 13px; color: #94a3b8; }
        .balance-amount { font-size: 32px; font-weight: bold; margin: 5px 0; }
        .quick-actions { display: flex; justify-content: space-around; margin-top: 20px; }
        .action-btn { background: #2563eb; color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 20px; margin-bottom: 5px; }
        .action-item { display: flex; flex-direction: column; align-items: center; font-size: 12px; }

        /* Pages Section */
        .page-content { display: none; padding: 15px; }
        .page-content.active { display: block; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-card { background: #ffffff; color: #1e293b; border-radius: 16px; width: 100%; max-width: 350px; padding: 20px; text-align: center; }
        .modal-card h3 { font-size: 20px; margin-bottom: 15px; color: #0f172a; }
        .modal-card p { font-size: 13px; color: #475569; margin-bottom: 10px; text-align: right; line-height: 1.5; }
        .btn-understand { background: #3b82f6; color: #fff; border: none; padding: 10px 30px; border-radius: 20px; width: 100%; font-size: 16px; margin-top: 15px; cursor: pointer; }

        /* Device Cards */
        .device-card { background: #ffffff; color: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .device-img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; }
        .device-info { flex: 1; margin-right: 15px; }
        .device-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .device-detail { font-size: 12px; color: #64748b; margin-bottom: 3px; }
        .btn-buy { background: #2563eb; color: #fff; border: none; padding: 8px 0; border-radius: 20px; width: 100%; font-weight: bold; margin-top: 8px; cursor: pointer; }

        /* Task & Profile List Rows */
        .list-row { background: #ffffff; color: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .list-row span { font-size: 14px; font-weight: 500; }

        /* Floating Support */
        .float-support { position: fixed; bottom: 75px; left: 15px; background: #2563eb; color: white; padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <!-- Welcome Modal -->
    <div id="welcomeModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Welcome Aboard!</h3>
            <p>✨ <strong>Your Welcome Benefits</strong><br>Enjoy a welcome bonus of 3 USDT for new users</p>
            <p>💼 <strong>Explore Available Plans</strong><br>Choose a plan that fits your budget and review the available products in the device
